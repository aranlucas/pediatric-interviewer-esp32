name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Lint shared interview contract
        run: pnpm exec oxlint shared

      - parallel:
          - name: Formatting
            run: pnpm format:check

          - name: Worker test, check, and deploy dry run
            run: cd worker && pnpm test && pnpm check && pnpm exec cf deploy --dry-run

          - name: Web test, check, build, and deploy dry run
            env:
              WEB_TOKEN_SECRET: ci-only-not-a-production-secret-000000
            run: cd web && pnpm test && pnpm check && pnpm build:worker && pnpm exec cf
              deploy --prebuilt --dry-run
    if: ${{ github.event.pull_request.draft != true }}

  audio-regression-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Fixed source passes race regressions
        run: pnpm --dir web exec vitest run test/browser-audio.test.ts -t 'replacement startup'
      - name: Original source fails both race regressions
        shell: bash
        run: |
          git show 9da2067:web/lib/browser-audio.ts > web/lib/browser-audio.ts
          set +e
          pnpm --dir web exec vitest run test/browser-audio.test.ts -t 'replacement startup' --reporter=json --outputFile=../audio-before.json
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const report = JSON.parse(fs.readFileSync("audio-before.json", "utf8"));
            assert.equal(report.numFailedTests, 2);
            const failures = report.testResults.flatMap(suite => suite.assertionResults).filter(test => test.status === "failed");
            assert.equal(failures.length, 2);
            assert(failures.every(test => test.fullName.includes("replacement startup")));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audio-before
          path: audio-before.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_AGENT_HOST: 127.0.0.1:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Build real web app with loopback agent host
        run: pnpm --dir web build
      - name: Install engine browser
        run: pnpm exec e2e-web install chromium --with-deps
      - name: Run deterministic browser journeys
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-evidence
          include-hidden-files: true
          path: .e2e/
          retention-days: 7
