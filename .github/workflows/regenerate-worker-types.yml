name: Regenerate Worker types

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    # This workflow has write access, so keep it limited to Dependabot branches
    # in this repository. The workflow itself comes from the base branch.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, 'wrangler')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        include:
          - directory: web
            generate-command: pnpm run cf-typegen
            generated-file: web/cloudflare-env.d.ts
          - directory: worker
            generate-command: pnpm run generate-types
            generated-file: worker/worker-configuration.d.ts

    steps:
      - name: Check out Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Regenerate Worker types
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.generate-command }}

      - name: Commit regenerated types
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GENERATED_FILE: ${{ matrix.generated-file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GENERATED_FILE}"
          if git diff --cached --quiet; then
            echo "Worker types are already current."
            exit 0
          fi
          git commit -m "chore: regenerate Cloudflare Worker types"
          git push origin "HEAD:${PR_BRANCH}"
